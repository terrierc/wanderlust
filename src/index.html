<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wanderlust</title>
<meta name="description" content="A private travel atlas and journey planner.">
<meta name="theme-color" content="#0c0a1d">

<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="__A__icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="__A__icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wanderlust">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preload" href="__A__fonts/fraunces-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="__A__fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="__A__styles/app.css">
<script type="application/json" id="elsewhere-config">__CONFIG__</script>
<script type="module" src="__A__app.js"></script>
</head>
<body>
<div id="app"><main id="main"><section class="loading"><p>Opening your atlas…</p></section></main></div>

</body>
</html>
